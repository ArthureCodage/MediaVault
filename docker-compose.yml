version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MEDIA_DIR=/media
      - DATA_DIR=/data
      - APP_USERNAME=admin
      - APP_PASSWORD=admin
      - SECRET_KEY=replace-with-a-secure-random-secret-key
    volumes:
      - ./data:/data
      - /path/to/your/media:/media:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
