services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MEDIA_DIR=/media
      - DATA_DIR=/data
      - APP_USERNAME=${APP_USERNAME:-admin}
      - APP_PASSWORD=${APP_PASSWORD:?Définissez APP_PASSWORD dans un fichier .env à côté de docker-compose.yml}
      - SECRET_KEY=${SECRET_KEY:?Définissez SECRET_KEY dans un fichier .env à côté de docker-compose.yml}
    volumes:
      - ./data:/data
      # Lecture seule : l'upload depuis l'appli est alors désactivé (retirez :ro pour l'autoriser)
      - ${MEDIA_PATH:-./media}:/media:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
